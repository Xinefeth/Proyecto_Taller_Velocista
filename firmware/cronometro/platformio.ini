; Cronómetro de meta · ESP32 · Arduino
; pio run -e cronometro       → compila para el cronómetro
; pio test -e native          → pruebas de la lógica pura en PC (lib/)

[platformio]
default_envs = cronometro

[env:cronometro]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
