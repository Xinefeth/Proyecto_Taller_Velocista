; Velocista 001 · ESP32-S3 · Arduino
; pio run -e velocista        → compila para el robot
; pio test -e native          → pruebas de la lógica pura en PC (lib/)

[platformio]
default_envs = velocista

[env:velocista]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
