# PostgreSQL 16 solo accesible desde esta máquina (127.0.0.1).
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: apaec-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - apaec-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Interfaz web para ver/editar las tablas. Solo accesible desde esta maquina
  # (127.0.0.1). Abrir http://localhost:8080 con los datos del .env.
  adminer:
    image: adminer:4
    container_name: apaec-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula

volumes:
  apaec-pgdata:
