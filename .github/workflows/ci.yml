# Integración continua: solo para desarrollo; el sistema no depende de ella para funcionar.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r docs/api/requirements-validation.txt
      - run: python docs/api/validar_contrato.py

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: apaec_app, POSTGRES_PASSWORD: ci, POSTGRES_DB: apaec_lab }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { POSTGRES_USER: apaec_app, POSTGRES_PASSWORD: ci, POSTGRES_DB: apaec_lab, POSTGRES_HOST: 127.0.0.1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: ruff format --check . && ruff check .
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  consola:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: consola } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: consola/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix: { proyecto: [velocista, cronometro] }
    defaults: { run: { working-directory: "firmware/${{ matrix.proyecto }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: cp include/config.example.h include/config.h
      - run: pio test -e native
      - run: pio run
