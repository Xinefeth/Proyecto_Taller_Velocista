[project]
name = "apaec-lab-api"
version = "0.1.0"
description = "API local de APAEC Lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "pytest-cov>=5.0",
  "websockets>=13",  # herramientas/robot_falso.py
]
# Se agregan cuando llegue su historia:
#   optimizacion -> "optuna>=4.0"            (HU-27, HU-28)
#   extraccion   -> "beautifulsoup4>=4.12"   (HU-05)
#   seguridad    -> "pyjwt>=2.9", "argon2-cffi>=23.1"  (auth)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integracion: requiere PostgreSQL levantado (se omite si no está disponible)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # el formateador controla el largo de línea
